version: "2"
linters:
  default: standard
  exclusions:
    rules:
      # tests write throwaway fixtures: unchecked cleanup and loose modes are fine
      - path: (_test\.go|internal/testutil/)
        linters: [errcheck, gosec]
  enable:
    - errorlint
    - gosec
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        - G204 # git is invoked with an argument array on purpose
        - G304 # config and hook paths are derived from the repository root
