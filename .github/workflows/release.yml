name: release

# Pushing a tag like v1.2.3 builds the binaries and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]" >&2; exit 1 ;;
          esac
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build archives
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - name: Verify checksums
        run: cd dist && sha256sum -c checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run the binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -xzf dist/gtide_${GITHUB_REF_NAME}_linux_amd64.tar.gz -C dist
          out=$(dist/gtide_${GITHUB_REF_NAME}_linux_amd64/gtide --version)
          echo "$out"
          test "$out" = "gtide version $GITHUB_REF_NAME"
      - name: Run the binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar -xzf dist/gtide_${GITHUB_REF_NAME}_darwin_arm64.tar.gz -C dist
          out=$(dist/gtide_${GITHUB_REF_NAME}_darwin_arm64/gtide --version)
          echo "$out"
          test "$out" = "gtide version $GITHUB_REF_NAME"
      - name: Run the binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          unzip -q dist/gtide_${GITHUB_REF_NAME}_windows_amd64.zip -d dist
          out=$(dist/gtide_${GITHUB_REF_NAME}_windows_amd64/gtide.exe --version)
          echo "$out"
          test "$out" = "gtide version $GITHUB_REF_NAME"

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install.sh scripts/install.ps1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag $flags
